<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>견적서 만들기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4f6; --card:#ffffff; --ink:#14202b; --muted:#5b6772; --line:#d3d9df;
  --accent:#0a4d8c; --accent-ink:#ffffff; --soft:#e4edf6; --warn:#b3261e;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Nanum Gothic",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161b; --card:#19212a; --ink:#e8edf2; --muted:#9ba7b3; --line:#2e3944;
    --accent:#5aa2e6; --accent-ink:#0b1722; --soft:#1f2e3e; --warn:#ff8a80;
  }
}
:root[data-theme="dark"]{
  --bg:#10161b; --card:#19212a; --ink:#e8edf2; --muted:#9ba7b3; --line:#2e3944;
  --accent:#5aa2e6; --accent-ink:#0b1722; --soft:#1f2e3e; --warn:#ff8a80;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
.app{max-width:560px;margin:0 auto;padding:20px 16px 150px}
header h1{font-size:22px;margin:4px 0 2px;font-weight:700;letter-spacing:-0.01em}
header p{margin:0 0 18px;color:var(--muted);font-size:14px}
section{padding:16px 0;border-top:1px solid var(--line)}
section:first-of-type{border-top:0;padding-top:4px}
h2{font-size:15px;margin:0 0 10px;font-weight:700}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
label .hint{color:var(--accent);font-weight:500;margin-left:4px}
input,textarea{
  display:block;width:100%;margin-top:4px;padding:11px 12px;font:inherit;font-size:16px;color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:8px;outline:none;
}
textarea{resize:vertical;min-height:72px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px}
.seg button{border:0;background:var(--card);color:var(--muted);padding:10px;font:inherit;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.item{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 12px 4px;margin-bottom:12px}
.item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.item-head b{font-size:14px}
.link{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;padding:6px 4px;cursor:pointer;text-decoration:underline}
.stepper{display:grid;grid-template-columns:44px 1fr 44px;margin-top:4px}
.stepper input{margin:0;text-align:center;border-radius:0;border-left:0;border-right:0}
.stepper button{border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer}
.stepper button:first-child{border-radius:8px 0 0 8px}
.stepper button:last-child{border-radius:0 8px 8px 0}
.money{position:relative}
.money input{padding-right:34px;text-align:right}
.money span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.calc{margin:2px 0 10px;font-size:13px;color:var(--muted);min-height:20px}
.add{width:100%;padding:12px;border:1px dashed var(--accent);background:none;color:var(--accent);font:inherit;font-weight:700;border-radius:10px;cursor:pointer}
.add[disabled]{opacity:.4;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:560px;margin:0 auto}
.sum{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.sum b{font-size:22px;letter-spacing:-0.01em}
.sum span{font-size:13px;color:var(--muted)}
.sub{font-size:12px;color:var(--muted);margin:0 0 10px}
.auto{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);margin:0 0 10px}
.auto input{display:inline-block;width:18px;height:18px;margin:0;padding:0}
.err{color:var(--warn);font-size:13px;margin:0 0 8px;min-height:0}
.primary{width:100%;padding:14px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.primary[disabled]{opacity:.5}
.secondary{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.sheet{width:100%;height:auto;display:block;border:1px solid var(--line);background:#fff;margin:6px 0 14px}
.actions{display:grid;gap:10px}
.status{font-size:13px;color:var(--muted);margin:4px 0 0;min-height:20px}
.tools{display:flex;justify-content:space-between;align-items:center}
[hidden]{display:none !important}
@media (prefers-reduced-motion: no-preference){ .primary,.chip,.add{transition:background .15s,border-color .15s} }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>견적서 만들기</h1>
    <p id="subtitle"></p>
  </header>

  <main id="screen-form">
    <section>
      <h2>발행처</h2>
      <div class="seg" id="sup" role="group" aria-label="발행처"></div>
    </section>

    <section>
      <h2>받는 분</h2>
      <label>이름 또는 업체명
        <input id="to" autocomplete="off" placeholder="">
      </label>
      <label>전화번호
        <input id="tel" type="tel" inputmode="tel" autocomplete="off" placeholder="010-0000-0000">
      </label>
    </section>

    <section>
      <h2>품목</h2>
      <div class="seg" role="group" aria-label="단가 기준">
        <button type="button" id="vat-incl" aria-pressed="true">VAT 포함 단가</button>
        <button type="button" id="vat-excl" aria-pressed="false">VAT 별도 단가</button>
      </div>
      <div id="items"></div>
      <button type="button" class="add" id="add">품목 추가</button>
    </section>

    <section>
      <h2>참고사항</h2>
      <div class="chips" id="chips">
        <button type="button" class="chip" data-k="연통" aria-pressed="false">연통 포함</button>
        <button type="button" class="chip" data-k="경보기" aria-pressed="false">경보기 포함</button>
        <button type="button" class="chip" data-k="출장비" aria-pressed="false">출장비 포함</button>
      </div>
      <label>추가 문구 (선택)
        <textarea id="extra" placeholder="견적서 하단에 그대로 들어갑니다"></textarea>
      </label>
    </section>

    <section>
      <h2>발행일</h2>
      <label>견적서에 찍히는 날짜
        <input id="date" type="date">
      </label>
    </section>
  </main>

  <main id="screen-preview" hidden>
    <div class="tools">
      <button type="button" class="link" id="back">← 수정하기</button>
      <button type="button" class="link" id="reset">새 견적서</button>
    </div>
    <img id="sheet" class="sheet" alt="완성된 견적서 미리보기">
    <div class="actions">
      <button type="button" class="primary" id="save-pdf">PDF로 저장</button>
      <button type="button" class="secondary" id="save-png">이미지로 저장</button>
    </div>
    <p class="status" id="status" role="status"></p>
  </main>
</div>

<div class="bar" id="bar">
  <div class="bar-in">
    <div class="sum"><span>합계 (VAT 포함)</span><b id="total">₩0</b></div>
    <p class="sub" id="sub">공급가액 0 · 세액 0</p>
    <label class="auto"><input type="checkbox" id="auto-png" checked>견적서를 만들면 바로 PNG 이미지로 저장</label>
    <p class="err" id="err" role="alert"></p>
    <button type="button" class="primary" id="make">견적서 만들기</button>
  </div>
</div>

<script>
//#calc-start
const VAT_RATE = 0.1;
function calcLine(it, mode){
  const q = Math.max(1, Math.floor(it.qty) || 1);
  const p = Math.max(0, Math.floor(it.price) || 0);
  let unit, supply, tax;
  if (mode === 'incl'){
    unit = Math.round(p / (1 + VAT_RATE));   // 공급 단가
    supply = unit * q;
    tax = p * q - supply;                      // 합계가 입력 금액과 정확히 일치하도록 세액이 반올림 오차를 흡수
  } else {
    unit = p;
    supply = unit * q;
    tax = Math.round(supply * VAT_RATE);
  }
  return { q, unit, supply, tax, total: supply + tax };
}
function calcAll(items, mode){
  let supply = 0, tax = 0;
  const lines = items.map(it => {
    const c = calcLine(it, mode);
    supply += c.supply; tax += c.tax;
    return c;
  });
  return { lines, supply, tax, total: supply + tax };
}
//#calc-end

//#pdf-start
function buildPdf(jpeg, pw, ph){
  const enc = new TextEncoder();
  const chunks = []; let offset = 0; const offs = [];
  const push = b => { const u = typeof b === 'string' ? enc.encode(b) : b; chunks.push(u); offset += u.length; };
  push('%PDF-1.4\n%\u00e2\u00e3\u00cf\u00d3\n');
  const obj = (n, body) => { offs[n] = offset; push(n + ' 0 obj\n' + body + '\nendobj\n'); };
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
  offs[4] = offset;
  push('4 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + pw + ' /Height ' + ph +
       ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpeg.length + ' >>\nstream\n');
  push(jpeg);
  push('\nendstream\nendobj\n');
  const content = 'q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
  obj(5, '<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream');
  const xref = offset;
  let x = 'xref\n0 6\n0000000000 65535 f \n';
  for (let i = 1; i <= 5; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
  push(x);
  push('trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF');
  return new Blob(chunks, { type: 'application/pdf' });
}
//#pdf-end

const MAX_ITEMS = 8;
const CHIP_ORDER = ['연통', '경보기', '출장비'];
const $ = s => document.querySelector(s);
const fmt = n => Number(n || 0).toLocaleString('ko-KR');
const pad = n => String(n).padStart(2, '0');
function todayStr(){ const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

const state = { vat: 'incl', items: [], chips: {}, profile: 'magi' };
const cards = [];
let downloads = null, lastCanvas = null, lastDataUrl = '';

/* ---------- 입력 화면 ---------- */
function newItem(){ return { name: '', spec: '', qty: 1, price: 0 }; }

function addItem(){
  if (state.items.length >= MAX_ITEMS) return;
  const it = newItem(); state.items.push(it);
  const el = document.createElement('div'); el.className = 'item';
  el.innerHTML =
    '<div class="item-head"><b class="no"></b><button type="button" class="link rm">삭제</button></div>' +
    '<label>품목명<input class="f-name" autocomplete="off" placeholder="예) NCB354-22KQ 콘덴싱 보일러"></label>' +
    '<div class="row2">' +
      '<label>규격<input class="f-spec" autocomplete="off" placeholder="예) 22,000K"></label>' +
      '<label>수량<div class="stepper"><button type="button" class="dec" aria-label="수량 줄이기">−</button>' +
        '<input class="f-qty" inputmode="numeric" value="1" aria-label="수량">' +
        '<button type="button" class="inc" aria-label="수량 늘리기">+</button></div></label>' +
    '</div>' +
    '<label>단가<span class="hint"></span><div class="money"><input class="f-price" inputmode="numeric" autocomplete="off" placeholder="0"><span>원</span></div></label>' +
    '<p class="calc"></p>';
  $('#items').appendChild(el);
  const ref = { it, el };
  cards.push(ref);
  const q = s => el.querySelector(s);
  q('.f-name').addEventListener('input', e => { it.name = e.target.value; });
  q('.f-spec').addEventListener('input', e => { it.spec = e.target.value; });
  q('.f-price').addEventListener('input', e => {
    const d = e.target.value.replace(/\D/g, '').slice(0, 10);
    it.price = Number(d || 0);
    e.target.value = d ? fmt(it.price) : '';
    refresh();
  });
  const setQty = v => { it.qty = Math.min(999, Math.max(1, v)); q('.f-qty').value = it.qty; refresh(); };
  q('.f-qty').addEventListener('input', e => {
    const d = e.target.value.replace(/\D/g, '').slice(0, 3);
    e.target.value = d; it.qty = Math.max(1, Number(d || 1)); refresh();
  });
  q('.f-qty').addEventListener('blur', () => { q('.f-qty').value = it.qty; });
  q('.dec').addEventListener('click', () => setQty(it.qty - 1));
  q('.inc').addEventListener('click', () => setQty(it.qty + 1));
  q('.rm').addEventListener('click', () => {
    if (state.items.length === 1) { Object.assign(it, newItem()); q('.f-name').value = ''; q('.f-spec').value = ''; q('.f-qty').value = 1; q('.f-price').value = ''; refresh(); return; }
    const i = state.items.indexOf(it); state.items.splice(i, 1); cards.splice(i, 1); el.remove(); refresh();
  });
  refresh();
}

function refresh(){
  const mode = state.vat;
  const all = calcAll(state.items, mode);
  cards.forEach((c, i) => {
    c.el.querySelector('.no').textContent = '품목 ' + (i + 1);
    c.el.querySelector('.rm').hidden = state.items.length === 1 && !c.it.name && !c.it.price;
    c.el.querySelector('.hint').textContent = mode === 'incl' ? '(VAT 포함)' : '(VAT 별도)';
    const l = all.lines[i];
    c.el.querySelector('.calc').textContent = c.it.price
      ? '공급가액 ' + fmt(l.supply) + ' · 세액 ' + fmt(l.tax) + ' · 합계 ' + fmt(l.total)
      : '';
  });
  $('#add').disabled = state.items.length >= MAX_ITEMS;
  $('#total').textContent = '₩' + fmt(all.total);
  $('#sub').textContent = '공급가액 ' + fmt(all.supply) + ' · 세액 ' + fmt(all.tax);
  $('#err').textContent = '';
}

function setVat(m){
  state.vat = m;
  $('#vat-incl').setAttribute('aria-pressed', String(m === 'incl'));
  $('#vat-excl').setAttribute('aria-pressed', String(m === 'excl'));
  refresh();
}

function noteLines(){
  const picked = CHIP_ORDER.filter(k => state.chips[k]);
  const lines = [];
  if (picked.length) lines.push('※ ' + picked.join(', ') + ' 포함 금액입니다.');
  const extra = $('#extra').value.replace(/\s+$/g, '');
  if (extra) extra.split('\n').forEach(s => lines.push(s));
  return lines;
}

function validate(){
  if (!$('#to').value.trim()) return { msg: '받는 분을 입력하세요.', el: $('#to') };
  const used = cards.filter(c => c.it.name.trim() || c.it.price);
  if (!used.length) return { msg: '품목을 입력하세요.', el: cards[0].el.querySelector('.f-name') };
  for (const c of used){
    if (!c.it.name.trim()) return { msg: '단가를 입력한 품목의 이름이 비어 있습니다.', el: c.el.querySelector('.f-name') };
  }
  if (!used.some(c => c.it.price > 0)) return { msg: '단가를 입력하세요.', el: used[0].el.querySelector('.f-price') };
  return null;
}

/* ---------- 견적서 그리기 (A4, 794x1123 기준 좌표) ---------- */
const FONT = '"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Nanum Gothic",sans-serif';
const INK = '#111', LINE = '#222', HEAD = '#dbe5f1';
function setFont(ctx, size, weight){ ctx.font = weight + ' ' + size + 'px ' + FONT; }
function T(ctx, s, x, y, o){
  o = o || {};
  const size = o.size || 12, weight = o.weight || 400, min = o.min || 8;
  let z = size; setFont(ctx, z, weight);
  if (o.maxW) while (ctx.measureText(s).width > o.maxW && z > min){ z -= 0.5; setFont(ctx, z, weight); }
  ctx.fillStyle = o.color || INK; ctx.textAlign = o.align || 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(s, x, y);
}
function wrap(ctx, s, maxW){
  const out = [];
  String(s).split('\n').forEach(p => {
    let line = '';
    for (const ch of p){
      const t = line + ch;
      if (ctx.measureText(t).width > maxW && line){ out.push(line); line = ch; } else line = t;
    }
    out.push(line);
  });
  return out;
}
function cell(ctx, x, y, w, h, fill){
  if (fill){ ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); }
  ctx.strokeRect(x + 0.5, y + 0.5, w, h);
}
function block(ctx, lines, cx, cy, lh, o){
  const top = cy - (lines.length - 1) * lh / 2;
  lines.forEach((s, i) => T(ctx, s, cx, top + i * lh, o));
}
function dateKo(s){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
  return m ? m[1] + '년 ' + Number(m[2]) + '월 ' + Number(m[3]) + '일' : '';
}

function drawQuote(imgs){
  const W = 794, H = 1123, S = 2.5;
  const cv = document.createElement('canvas');
  cv.width = Math.round(W * S); cv.height = Math.round(H * S);
  const ctx = cv.getContext('2d');
  ctx.scale(S, S);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  ctx.lineWidth = 1; ctx.strokeStyle = LINE; ctx.lineJoin = 'miter';

  const all = calcAll(state.items, state.vat);
  const used = [];
  cards.forEach((c, i) => { if (c.it.name.trim() || c.it.price) used.push({ it: c.it, l: all.lines[i] }); });
  const sum = { supply: 0, tax: 0 };
  used.forEach(u => { sum.supply += u.l.supply; sum.tax += u.l.tax; });

  // 외곽선, 로고, 제목
  ctx.strokeRect(40.5, 40.5, 714, 770);
  const P = PROFILES[state.profile];
  if (P.logos.length === 2){
    ctx.drawImage(imgs.logo1, 548, 50, 196, 196 * 96 / 452);
    ctx.drawImage(imgs.logo2, 548, 93, 196, 196 * 58 / 466);
  } else {
    const im = imgs[P.logos[0]], lw = 150, lh = lw * im.naturalHeight / im.naturalWidth;
    ctx.drawImage(im, 744 - lw, 88 - lh / 2, lw, lh);
  }
  T(ctx, '견   적   서', 297, 92, { size: 30, weight: 700, align: 'center' });

  // 좌측: 날짜, 받는 분
  T(ctx, dateKo($('#date').value), 175, 172, { size: 14, weight: 700, align: 'center' });
  T(ctx, $('#to').value.trim(), 58, 212, { size: 17, weight: 700, maxW: 200, min: 11 });
  T(ctx, '귀중', 300, 214, { size: 11, weight: 500, align: 'right' });
  const tel = $('#tel').value.trim();
  if (tel) T(ctx, tel, 58, 240, { size: 13, maxW: 230 });
  T(ctx, '아래와 같이 견적합니다.', 58, 292, { size: 12 });

  // 공급자 표
  const tx = 330, ty = 130, rh = [24, 34, 36, 24, 24];
  const ys = [ty]; rh.forEach(h => ys.push(ys[ys.length - 1] + h));
  const xL = 352, xV = 424, xL2 = 598, xV2 = 656, xR = 754;
  cell(ctx, tx, ty, xL - tx, ys[5] - ty, HEAD);
  ['공', '급', '자'].forEach((c, i) => T(ctx, c, (tx + xL) / 2, ty + 142 / 2 - 17 + i * 17, { size: 12, weight: 700, align: 'center' }));
  const lab = (i, s) => { cell(ctx, xL, ys[i], xV - xL, rh[i], HEAD); T(ctx, s, (xL + xV) / 2, ys[i] + rh[i] / 2, { size: 12, weight: 700, align: 'center' }); };
  const lab2 = (i, s) => { cell(ctx, xL2, ys[i], xV2 - xL2, rh[i], HEAD); T(ctx, s, (xL2 + xV2) / 2, ys[i] + rh[i] / 2, { size: 12, weight: 700, align: 'center' }); };
  const val = (i, x, w) => cell(ctx, x, ys[i], w, rh[i]);
  lab(0, '등록번호'); val(0, xV, xR - xV);
  T(ctx, P.reg, (xV + xR) / 2, ys[0] + 12, { size: 13, align: 'center' });
  lab(1, '상  호'); val(1, xV, xL2 - xV); lab2(1, '성  명'); val(1, xV2, xR - xV2);
  block(ctx, P.name, (xV + xL2) / 2, ys[1] + 17, 14, { size: 11.5, align: 'center', maxW: xL2 - xV - 8 });
  T(ctx, P.rep, xV2 + 8, ys[1] + 17, { size: 13, weight: 500 });
  lab(2, '사업장주소'); val(2, xV, xR - xV);
  block(ctx, P.addr, (xV + xR) / 2, ys[2] + 18, 15, { size: 10.5, align: 'center', maxW: xR - xV - 8 });
  lab(3, '업  태'); val(3, xV, xL2 - xV); lab2(3, '종  목'); val(3, xV2, xR - xV2);
  T(ctx, P.biz, (xV + xL2) / 2, ys[3] + 12, { size: 11, align: 'center', maxW: xL2 - xV - 8 });
  T(ctx, P.item, (xV2 + xR) / 2, ys[3] + 12, { size: 11, align: 'center', maxW: xR - xV2 - 6 });
  lab(4, '전화번호'); val(4, xV, xR - xV);
  T(ctx, P.tel, (xV + xR) / 2, ys[4] + 12, { size: 12, align: 'center', maxW: xR - xV - 8 });
  if (P.stamp) ctx.drawImage(imgs.stamp, 708, ys[1] - 2, 40, 40);

  // 합계금액
  T(ctx, '합계금액', 58, 322, { size: 16, weight: 700 });
  T(ctx, '\u20A9 ' + fmt(sum.supply + sum.tax), 640, 320, { size: 26, weight: 700, align: 'right' });
  ctx.beginPath(); ctx.moveTo(330, 340.5); ctx.lineTo(642, 340.5); ctx.stroke();
  T(ctx, '(VAT포함)', 650, 326, { size: 11, weight: 700 });

  // 품목 표
  T(ctx, '세부견적서 내역', 58, 362, { size: 11 });
  const cx = [40, 270, 380, 432, 532, 642, 754], hy = 374, hh = 26, rowH = 32;
  const heads = ['품 목', '규 격', '수 량', '단 가', '공급가액', '세 액'];
  heads.forEach((h, i) => { cell(ctx, cx[i], hy, cx[i + 1] - cx[i], hh, HEAD); T(ctx, h, (cx[i] + cx[i + 1]) / 2, hy + hh / 2, { size: 12, weight: 700, align: 'center' }); });
  const dash = n => n ? fmt(n) : '-';
  for (let r = 0; r < MAX_ITEMS; r++){
    const y = hy + hh + r * rowH, u = used[r];
    for (let i = 0; i < 6; i++) cell(ctx, cx[i], y, cx[i + 1] - cx[i], rowH);
    if (!u) continue;
    const cy = y + rowH / 2;
    let size = 12; setFont(ctx, size, 700);
    let lines = wrap(ctx, u.it.name.trim(), 216);
    if (lines.length > 2){ size = 10.5; setFont(ctx, size, 700); lines = wrap(ctx, u.it.name.trim(), 216); }
    block(ctx, lines.slice(0, 2), (cx[0] + cx[1]) / 2, cy, 14, { size, weight: 700, align: 'center' });
    if (u.it.spec.trim()) T(ctx, u.it.spec.trim(), (cx[1] + cx[2]) / 2, cy, { size: 11.5, align: 'center', maxW: 98, min: 8 });
    T(ctx, String(u.l.q), (cx[2] + cx[3]) / 2, cy, { size: 13, weight: 700, align: 'center' });
    T(ctx, dash(u.l.unit), cx[4] - 8, cy, { size: 12, align: 'right' });
    T(ctx, dash(u.l.supply), cx[5] - 8, cy, { size: 12, align: 'right' });
    T(ctx, dash(u.l.tax), cx[6] - 8, cy, { size: 12, align: 'right' });
  }
  const sy = hy + hh + MAX_ITEMS * rowH;
  cell(ctx, cx[0], sy, cx[4] - cx[0], hh, HEAD);
  T(ctx, '합   계', (cx[0] + cx[4]) / 2, sy + hh / 2, { size: 13, weight: 700, align: 'center' });
  cell(ctx, cx[4], sy, cx[5] - cx[4], hh, HEAD); cell(ctx, cx[5], sy, cx[6] - cx[5], hh, HEAD);
  T(ctx, '\u20A9' + fmt(sum.supply), cx[5] - 8, sy + hh / 2, { size: 13, weight: 700, align: 'right' });
  T(ctx, '\u20A9' + fmt(sum.tax), cx[6] - 8, sy + hh / 2, { size: 13, weight: 700, align: 'right' });

  // 참고사항
  const ny = sy + hh + 14;
  T(ctx, '[참고사항]', 50, ny, { size: 11, weight: 700 });
  setFont(ctx, 12, 400);
  let k = 0;
  noteLines().forEach(s => wrap(ctx, s, 680).forEach(l => { if (k < 6){ T(ctx, l, 52, ny + 22 + k * 18, { size: 12 }); k++; } }));
  return cv;
}

/* ---------- 화면 전환, 저장 ---------- */
function show(which){
  $('#screen-form').hidden = which !== 'form';
  $('#screen-preview').hidden = which !== 'preview';
  $('#bar').hidden = which !== 'form';
  window.scrollTo(0, 0);
}
function dataUrlToBytes(u){
  const b = atob(u.split(',')[1]); const a = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i);
  return a;
}
function loadImg(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
const assets = Promise.all([loadImg(IMG.stamp), loadImg(IMG.logo1), loadImg(IMG.logo2), loadImg(IMG.rinnai), loadImg(IMG.kiturami)])
  .then(a => ({ stamp: a[0], logo1: a[1], logo2: a[2], rinnai: a[3], kiturami: a[4] }));
async function fontsReady(){
  try { await Promise.all([document.fonts.load('400 14px "Noto Sans KR"'), document.fonts.load('700 14px "Noto Sans KR"'), document.fonts.load('500 14px "Noto Sans KR"')]); } catch (e) {}
}
function setStatus(s){ $('#status').textContent = s; }
function fileBase(){
  const to = $('#to').value.trim().replace(/[\\/:*?"<>|\s]+/g, '_') || '견적서';
  return '견적서_' + to + '_' + ($('#date').value || todayStr()).replace(/-/g, '');
}

async function makeEstimate(){
  const err = validate();
  if (err){ $('#err').textContent = err.msg; if (err.el) err.el.focus(); return; }
  const btn = $('#make'); btn.disabled = true; btn.textContent = '만드는 중…';
  try {
    await fontsReady();
    lastCanvas = drawQuote(await assets);
    lastDataUrl = lastCanvas.toDataURL('image/jpeg', 0.92);
    $('#sheet').src = lastDataUrl;
    setStatus((downloads || standalone) ? '' : '이 화면에서는 파일 저장을 쓸 수 없습니다. 견적서를 길게 눌러 이미지로 저장하세요.');
    show('preview');
    if ($('#auto-png').checked && (downloads || standalone)) saveAs('png');
  } catch (e) {
    $('#err').textContent = '견적서를 만들지 못했습니다. 다시 시도해 주세요.';
  } finally { btn.disabled = false; btn.textContent = '견적서 만들기'; }
}

const standalone = !(window.claude && window.claude.use);
function anchorSave(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}
async function saveAs(kind){
  if (!downloads && !standalone){ setStatus('이 화면에서는 파일 저장을 쓸 수 없습니다. 견적서를 길게 눌러 이미지로 저장하세요.'); return; }
  try {
    let data, name;
    if (kind === 'pdf'){ data = buildPdf(dataUrlToBytes(lastDataUrl), lastCanvas.width, lastCanvas.height); name = fileBase() + '.pdf'; }
    else { data = new Blob([dataUrlToBytes(lastCanvas.toDataURL('image/png'))], { type: 'image/png' }); name = fileBase() + '.png'; }
    if (downloads){ await downloads.save({ filename: name, data }); setStatus('저장했습니다.'); }
    else { anchorSave(data, name); setStatus('저장을 요청했습니다. 다운로드 폴더를 확인하세요.'); }
  } catch (e) {
    setStatus(e && e.code === 'declined' ? '저장을 취소했습니다.' : '저장하지 못했습니다. 견적서를 길게 눌러 이미지로 저장해 보세요.');
  }
}

function setProfile(k){
  if (!PROFILES[k]) return;
  state.profile = k;
  document.querySelectorAll('#sup button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === k)));
  $('#subtitle').textContent = PROFILES[k].title;
  $('#to').placeholder = PROFILES[k].ph;
  document.title = '견적서 만들기 - ' + PROFILES[k].label;
  try { localStorage.setItem('quote-profile', k); } catch (e) {}
}
function initProfile(){
  const keys = Object.keys(PROFILES);
  if (keys.length < 2){ $('#sup').closest('section').hidden = true; setProfile(keys[0]); return; }
  const box = $('#sup');
  Object.keys(PROFILES).forEach(k => {
    const b = document.createElement('button');
    b.type = 'button'; b.dataset.k = k; b.textContent = PROFILES[k].label;
    b.addEventListener('click', () => setProfile(k));
    box.appendChild(b);
  });
  let k = (location.hash || '').replace('#', '');
  if (!PROFILES[k]) { try { k = localStorage.getItem('quote-profile') || ''; } catch (e) { k = ''; } }
  setProfile(PROFILES[k] ? k : 'magi');
}

function resetAll(){
  $('#to').value = ''; $('#tel').value = ''; $('#extra').value = ''; $('#date').value = todayStr();
  state.chips = {}; document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', 'false'));
  cards.splice(0).forEach(c => c.el.remove()); state.items.length = 0;
  setVat('incl'); addItem(); show('form');
}

/* ---------- 시작 ---------- */
$('#add').addEventListener('click', () => { addItem(); const last = cards[cards.length - 1]; last.el.querySelector('.f-name').focus(); });
$('#vat-incl').addEventListener('click', () => setVat('incl'));
$('#vat-excl').addEventListener('click', () => setVat('excl'));
$('#chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  const k = b.dataset.k; state.chips[k] = !state.chips[k];
  b.setAttribute('aria-pressed', String(!!state.chips[k]));
});
$('#make').addEventListener('click', makeEstimate);
$('#back').addEventListener('click', () => show('form'));
$('#reset').addEventListener('click', resetAll);
$('#save-pdf').addEventListener('click', () => saveAs('pdf'));
$('#save-png').addEventListener('click', () => saveAs('png'));
$('#date').value = todayStr();
initProfile();
addItem();
try {
  if (window.claude && window.claude.use){
    window.claude.use('downloads').then(d => { downloads = d; }).catch(() => {});
  }
} catch (e) {}
</script>
